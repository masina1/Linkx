<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0f14; }
  .stage {
    width: 1400px; height: 560px;
    background:
      radial-gradient(680px 520px at 26% 42%, rgba(22,163,74,0.20), transparent 62%),
      #0b0f14;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center;
    padding: 0 110px;
    position: relative;
    overflow: hidden;
  }
  /* faint ring echo of the icon, top-right */
  .stage::after {
    content: ""; position: absolute; right: -140px; top: -140px;
    width: 460px; height: 460px; border-radius: 50%;
    border: 2px solid rgba(30,39,51,0.9);
  }
  .row { display: flex; align-items: center; gap: 56px; position: relative; z-index: 1; }
  .mark { filter: drop-shadow(0 8px 30px rgba(22,163,74,0.35)); }
  .word { font-size: 132px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; }
  .word .x { color: #16a34a; }
  .tag { margin-top: 18px; font-size: 30px; color: #8b98a5; letter-spacing: -0.01em; }
  .days { margin-top: 30px; display: flex; gap: 10px; }
  .pill {
    border: 1px solid #1e2733; background: #0e141c; color: #8b98a5;
    border-radius: 999px; padding: 8px 16px; font-size: 18px; font-weight: 600;
  }
  .pill.on { background: #16a34a; border-color: #16a34a; color: #fff; }
</style>
</head>
<body>
  <div class="stage">
    <div class="row">
      <svg class="mark" viewBox="0 0 100 100" width="220" height="220" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#16a34a"/>
        <circle cx="50" cy="50" r="42" fill="#ffffff"/>
        <circle cx="50" cy="50" r="30" fill="#16a34a"/>
      </svg>
      <div>
        <div class="word">Link<span class="x">x</span></div>
        <div class="tag">Open today's links in one click.</div>
        <div class="days">
          <span class="pill on">Mon</span>
          <span class="pill">Tue</span>
          <span class="pill on">Wed</span>
          <span class="pill">Thu</span>
          <span class="pill on">Fri</span>
          <span class="pill">Sat</span>
          <span class="pill">Sun</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
